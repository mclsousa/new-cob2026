
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVBR.Cob</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#5E17EB">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Design system (referência Dataviz). Cores de superfície/texto vêm de variáveis CSS
      // e trocam sozinhas no modo escuro; cores de marca/status são fixas.
      const v = (name) => `rgb(var(--${name}) / <alpha-value>)`;
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              canvas: v('canvas'),
              card: v('card'),
              subtle: v('subtle'),
              line: v('line'),
              ink: v('ink'),
              muted: v('muted'),
              brand: { DEFAULT: '#5E17EB', hover: '#4C0FD0', soft: v('brand-soft') },
              ok: '#1FC8B4',
              info: '#2F54EB',
              warn: '#F5A623',
              danger: '#E5536B',
              graphite: '#3A3F4B',
              whatsapp: { DEFAULT: '#25D366', hover: '#1DAD57' },
            },
            fontFamily: {
              sans: ['Roboto', 'system-ui', 'sans-serif'],
              mono: ['"Roboto Mono"', 'ui-monospace', 'monospace'],
            },
            boxShadow: {
              card: '0 1px 3px rgba(20, 20, 40, 0.06)',
              pop: '0 10px 30px rgba(20, 20, 40, 0.14)',
            },
          }
        }
      }
    </script>
    <style>
      :root {
        --canvas: 241 242 247; --card: 255 255 255; --subtle: 246 247 251;
        --line: 230 232 239; --ink: 58 63 75; --muted: 138 143 163; --brand-soft: 239 232 253;
        color-scheme: light;
      }
      .dark {
        --canvas: 18 19 26; --card: 27 29 39; --subtle: 34 36 48;
        --line: 42 45 58; --ink: 226 228 236; --muted: 139 144 166; --brand-soft: 45 30 85;
        color-scheme: dark;
      }
      body { font-family: Roboto, system-ui, sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgb(var(--line)); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgb(var(--muted)); }
      @keyframes bounce-in {
        0% { opacity: 0; transform: translateY(8px) scale(0.97); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-bounce-in { animation: bounce-in 0.18s ease-out; }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fade-in 0.2s ease-out; }
      @keyframes fade-in-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in-up { animation: fade-in-up 0.25s ease-out; }
    </style>

</head>
<body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
