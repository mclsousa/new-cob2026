# Gera o APK Android (TWA) assinado e publica como Release no GitHub.
# Link fixo da versão mais recente:
#   https://github.com/mclsousa/new-cob2026/releases/latest/download/TVBR.Cob.apk
# Segredos necessários: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restaurar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar APK assinado
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Conferir assinatura
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -i "SHA-256"
          cp "$APK" TVBR.Cob.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVBR.Cob-apk
          path: TVBR.Cob.apk

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-v1.0.${{ github.run_number }}" TVBR.Cob.apk \
            --title "TVBR.Cob Android v1.0.${{ github.run_number }}" \
            --notes "APK Android do TVBR.Cob. Baixe e instale no celular (permita instalar de fontes desconhecidas)." \
            --latest
