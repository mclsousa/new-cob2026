# Gera o APK Android nativo (Capacitor) assinado e publica como Release no GitHub.
# O app web vai empacotado dentro do APK, então todo push na main gera uma versão nova.
# O app instalado consulta a última Release, avisa "Nova versão disponível" com as novidades
# e baixa/instala o APK por dentro (utils/updates.ts).
# Link fixo da versão mais recente:
#   https://github.com/mclsousa/new-cob2026/releases/latest/download/TVBR.Cob.apk
# Segredos necessários: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/workflows/notify.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico e tags: as novidades saem dos commits desde a última versão

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Capacitor 8 exige JDK 21

      - name: Compilar app web e copiar para o Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Restaurar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar APK assinado
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Conferir assinatura
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -i "SHA-256"
          cp "$APK" TVBR.Cob.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVBR.Cob-apk
          path: TVBR.Cob.apk

      # O app lê as linhas "- ..." desta lista e mostra em "O que mudou" ao avisar da atualização.
      # Só entram commits feat/fix/perf; o resto (ci, docs, chore) fica de fora.
      - name: Gerar novidades da versão
        run: |
          PREV=$(git describe --tags --match 'apk-v*' --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## Novidades"
            git log ${PREV:+$PREV..}HEAD --no-merges --pretty='%s' \
              | sed -nE 's/^feat(\([^)]*\))?!?: */- Novo: /p; s/^fix(\([^)]*\))?!?: */- Correção: /p; s/^perf(\([^)]*\))?!?: */- Melhoria: /p'
            echo
            echo "Instala por cima da versão anterior; os dados continuam no aparelho."
          } > notes.md
          grep -q '^- ' notes.md || sed -i '1a - Melhoria: ajustes e correções gerais' notes.md
          cat notes.md

      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-v2.0.${{ github.run_number }}" TVBR.Cob.apk \
            --title "TVBR.Cob Android v2.0.${{ github.run_number }}" \
            --notes-file notes.md \
            --latest
